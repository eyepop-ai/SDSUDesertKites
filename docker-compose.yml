services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    container_name: eyepop-sdsudesertkites
    ports:
      - "8501:8501"
    volumes:
      # Mount temp directories for persistence
      - ./temp_streamlit:/home/appuser/temp_streamlit
      - ./results:/home/appuser/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

