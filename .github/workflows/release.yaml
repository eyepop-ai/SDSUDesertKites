name: Release

on:
  release:
    types: [published]

concurrency:
  group: "release"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    environment: staging
    runs-on: eyepop-runner
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Build and push
        uses: eyepop-ai/eyepop-actions/build-ghcr@9f54c4e2bb92bebb3b5ea4f04c5b4fed703e63be
        with:
          repo: eyepop-ai/sdsu-desert-kites